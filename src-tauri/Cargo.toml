[package]
name = "fugo-launcher"
version = "3.2.0"
description = "Fugo Launcher — Liquid Glass Minecraft & Horizon Rust Edition Launcher"
authors = ["achinthyaj"]
edition = "2024"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
open = "5"
urlencoding = "2"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
zip = "2"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"

# Fast build profiles optimized for sub-2-minute builds:
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 2
codegen-units = 16
lto = "thin"
panic = "abort"
strip = true
debug = false
incremental = false
