name: Windows build (artifacts only)

# Builds the Windows installers (NSIS .exe and MSI) from the branch it runs on and keeps them as
# downloadable workflow artifacts. It publishes nothing: no tag, no release.

on:
  workflow_dispatch:
  push:
    branches:
      - offline-launch

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build the front end (Tauri embeds dist/ at compile time)
        run: pnpm run build

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Keep the installers as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: fugo-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
