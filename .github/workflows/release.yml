name: Release

# Every new tag that starts with "v" (for example v4.0.5) builds Fugo and publishes a GitHub
# release with these files attached:
#   Linux x64:   .deb, .AppImage, pkg.tar.zst (Arch)
#   Windows x64: the NSIS installer (.exe) and the MSI
# The tag must match the version in src-tauri/tauri.conf.json.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - name: Windows x64
            os: windows-latest
            args: ""

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the app version v${version} in src-tauri/tauri.conf.json."
            exit 1
          fi

      - name: Install Linux system libraries (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build the front end (Tauri embeds dist/ at compile time)
        run: pnpm run build

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the installers and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fugo ${{ github.ref_name }}"
          releaseBody: "Fugo ${{ github.ref_name }}. Download the installer for your system below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Stage the Arch package inputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p arch-inputs
          cp src-tauri/target/release/fugo-launcher arch-inputs/
          cp src-tauri/icons/128x128.png arch-inputs/fugo-launcher.png
          cp packaging/arch/PKGBUILD packaging/arch/fugo-launcher.desktop arch-inputs/
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          sed -i "s/^pkgver=0$/pkgver=${version}/" arch-inputs/PKGBUILD

      - name: Keep the Arch package inputs for the next job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: arch-inputs
          path: arch-inputs

  arch-package:
    name: Arch package (pkg.tar.zst)
    needs: release
    runs-on: ubuntu-22.04
    container: archlinux:latest
    steps:
      - name: Get the package inputs
        uses: actions/download-artifact@v4
        with:
          name: arch-inputs
          path: arch

      - name: Build the package with makepkg
        shell: bash
        run: |
          pacman -Syu --noconfirm base-devel github-cli webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg xdotool openssl
          useradd -m builder
          chmod -R a+rwX arch
          su builder -c "cd '$GITHUB_WORKSPACE/arch' && makepkg --noconfirm --skippgpcheck -f"
          ls -l arch/*.pkg.tar.zst

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" arch/*.pkg.tar.zst --clobber
